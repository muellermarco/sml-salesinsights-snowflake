unique_name: Customer Count-Order Retail445-YTD
object_type: metric_calc
label: Customer Count-Order Retail445-YTD
description: Sales Amount Year-to-date Order Retail445
expression: >-
  CASE WHEN ISEMPTY([Measures].[customercount1]) THEN NULL 

  ELSE 

  Avg(PeriodsToDate([Order Date Dimension].[Order Retail445].[Order rpt_Year],
  [Order Date Dimension].[Order Retail445].CurrentMember),
  [Measures].[customercount1]) 

  END
format: general number
is_hidden: false
