unique_name: Sales Amount SStdev-Order Retail445-PrevYear
object_type: metric_calc
label: Sales Amount SStdev-Order Retail445-PrevYear
description: "Sales Amount SStdev for the same period of the previous year (parallel period) along the Order Retail445 hierarchy of the Order Date Dimension."
expression: >-
  CASE WHEN ISEMPTY([Measures].[salesamountsstdev1]) THEN 

  NULL 

  ELSE (ParallelPeriod([Order Date Dimension].[Order Retail445].[Order
  rpt_Year], 1, [Order Date Dimension].[Order Retail445].CurrentMember),
  [Measures].[salesamountsstdev1]) END
format: $#,##0.00
is_hidden: false
