unique_name: factinternetsales2
object_type: dataset
label: factinternetsales2
columns:
  - name: currencykey
    data_type: decimal(38,0)
  - name: customerkey
    data_type: decimal(38,0)
  - name: orderdate
    data_type: string
  - name: orderdatekey
    data_type: decimal(38,0)
  - name: orderquantity
    data_type: decimal(38,0)
  - name: productkey
    data_type: decimal(38,0)
  - name: sales_reasons
    data_type: string
  - name: salesamount
    data_type: double
  - name: salesorderlinenumber
    data_type: decimal(38,0)
  - name: salesordernumber
    data_type: string
  - name: shipdatekey
    data_type: decimal(38,0)
  - name: taxamt
    data_type: double
  - name: unitprice
    data_type: double
  - name: product_info
    map:
      field_terminator: ','
      key_terminator: ':'
      key_type: String
      value_type: String
  - name: color
    data_type: string
    parent_column: product_info
  - name: size
    data_type: string
    parent_column: product_info
  - name: style
    data_type: string
    parent_column: product_info
  - name: weight
    data_type: decimal
    parent_column: product_info
  - name: Calculated Tax
    data_type: double
    sql: '"salesamount"*0.085'
  - name: productline
    data_type: string
connection_id: common_connection
model_properties:
  - create_hinted_aggregate: false
    model: Internet Sales
project_properties:
  aggregate_locality: managed
  allow_aggregates: true
sql: |
  select 
  fact.*
  , prd."productline"
  from 
  SE_DEMO_LIBRARY.AS_ADVENTURE.FACTINTERNETSALES fact
  join SE_DEMO_LIBRARY.AS_ADVENTURE.dimproduct prd
  on fact."productkey" = prd."productkey"
